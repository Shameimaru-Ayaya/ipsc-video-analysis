name: Build executables

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller and all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pyinstaller \
            opencv-python-headless \
            numpy \
            pandas \
            plotly \
            scipy \
            PyQt5

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed video_processer_final.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-video-processer
          path: dist/video_processer_final*
